[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humanized-ai-likelihood"
version = "0.1.0"
description = "A from-scratch classifier for paraphrased AI-text likelihood"
requires-python = ">=3.11"
dependencies = ["datasets>=3.0", "numpy>=1.26", "pyarrow>=15", "scikit-learn>=1.5", "torch>=2.3", "tokenizers>=0.19", "onnx>=1.16", "onnxscript>=0.1", "onnxruntime>=1.18"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
